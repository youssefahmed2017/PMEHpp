[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pmeh"
version = "0.3.0"
description = "PunishMeEvenHarder++: a programming language that is harder than assembly"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Youssef Ahmed" }]

[project.scripts]
pmeh = "pmeh:main"

[tool.setuptools]
py-modules = ["pmeh", "pmehc"]
